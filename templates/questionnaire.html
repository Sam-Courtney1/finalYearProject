<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Questionnaire | Organ Donation System</title>
    <link rel="stylesheet" href="/static/questionare.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<!-- Fix formatting, from tab too 2 spaces-->

<div class="bg-white">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('homepage') }}">Home</a>
            <div class="ms-auto">
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
</div>



<body>
    <div class="background">
        <div class="login-container">
            <div class="heading-text">
                <h1>Questionnaire</h1>
            </div>
            <div class="login-box">
                <h2>Please answer all questions</h2>
                <form action="{{ url_for('submitQuestionnaire') }}" method="POST">
                    <input type="text" name="blood_type" placeholder="Blood Type" required>
                    <input type="text" name="organ" placeholder="Organ" required>
                    <input type="text" name="address" placeholder="Address" required>
                    <br>
                    <input type="checkbox" name="consent" placeholder="consent" required>
                    I consent to the use of my data

                    <div class="button-group">
                        <button href="{{ url_for('homepage') }}" class="register-btn">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>


</html>
