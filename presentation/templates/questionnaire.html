<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire | Organ Donation System</title>
    <link rel="stylesheet" href="/static/questionare.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    Check if you actually need the sepeatre style sheet, nav bar looks good so i doubt it-->
</head>
<!-- Fix formatting, from tab too 2 spaces-->

<div class="bg-white">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home_bp.homepage') }}">Home</a>
            <div class="ms-auto">
                <a class="nav-link" href="{{ url_for('auth_bp.logout') }}">Logout</a>
            </div>
        </div>
    </nav>
</div>



<body>
    <div class="background">
        <div class="login-container">
            <div class="heading-text">
                <h1>Questionnaire</h1>
            </div>
            <div class="login-box">
                <h2>Please answer all questions</h2>
                <form action="{{ url_for('questionnaire_bp.questionnaire_form', client_id = client_id) }}" method="POST">
                    {% for f in static_fields %}
                    <div class="mb-3">
                        <label>{{ f[1] }}</label>
                        <input type="{{ f[2] }}" name="{{ f[0] }}" class="form-control" required>
                    </div>
                    {% endfor %}


                    <!-- Dynamic fields added by clients -->
                    {% for f in dynamic_fields %}
                    <div class="mb-3">
                        <label>{{ f[1] }}</label>
                        <input type="{{ f[2] }}" name="field_{{ f[0] }}" class="form-control" required>
                    </div>
                    {% endfor %}


                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="consent" required>
                        <label class="form-check-label">I consent to the use of my data and that all categories chosen
                            are correct to the best of my knowledge</label>
                    </div>

                    <button type="submit" class="btn btn-success mt-3">Submit</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
