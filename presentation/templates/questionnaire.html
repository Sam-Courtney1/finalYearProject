{% extends "base_user.html" %}

{% block title %}Questionnaire | Organ Donation System{% endblock %}

{% block content %}
<div class="auth-background">
    <div class="questionnaire-container">
        <div class="auth-heading">
            <h1>Questionnaire</h1>
        </div>
        <div class="questionnaire-card">
            <h2>Please answer all questions</h2>
            <form action="{{ url_for('questionnaire_bp.questionnaire_form', client_id = client_id) }}"
                  method="POST" class="questionnaire-form">
                {% for f in static_fields %}
                <div class="mb-3">
                    <label>{{ f[1] }}</label>
                    <input type="{{ f[2] }}" name="{{ f[0] }}" class="form-control" required>
                </div>
                {% endfor %}

                {% for f in dynamic_fields %}
                <div class="mb-3">
                    <label>{{ f[1] }}</label>
                    <input type="{{ f[2] }}" name="field_{{ f[0] }}" class="form-control" required>
                </div>
                {% endfor %}

                <div class="consent-check">
                    <input class="form-check-input" type="checkbox" name="consent" id="consentCheck" required>
                    <label class="form-check-label" for="consentCheck">
                        I consent to the use of my data
                    </label>
                </div>

                <button type="submit" class="btn-submit-questionnaire">
                    <i class="bi bi-send me-2"></i>Submit
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
