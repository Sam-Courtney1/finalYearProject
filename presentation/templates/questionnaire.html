<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Questionnaire | Organ Donation System</title>
    <link rel="stylesheet" href="/static/questionare.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    Check if you actually need the sepeatre style sheet, nav bar looks good so i doubt it-->
</head>
<!-- Fix formatting, from tab too 2 spaces-->

<div class="bg-white">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home_bp.homepage') }}">Home</a>
            <div class="ms-auto">
                <a class="nav-link" href="{{ url_for('auth_bp.logout') }}">Logout</a>
            </div>
        </div>
    </nav>
</div>



<body>
    <div class="background">
        <div class="login-container">
            <div class="heading-text">
                <h1>Questionnaire</h1>
            </div>
            <div class="login-box">
                <h2>Please answer all questions</h2>
                <form action="{{ url_for('questionnaire_bp.submit_questionnaire') }}" method="POST">


                    <input type="text" name="first_name" placeholder="First Name" required>
                    <label for="first_name_category">Category:</label>
                    <select name="first_name_category" id="first_name_category" required>
                        <option value="" disabled selected hidden>Select category</option>
                        <option value="PII">PII</option>
                    </select>

                    <input type="text" name="age" placeholder="Age" required>
                    <label for="Age_category">Category:</label>
                    <select name="Age_category" id="Age_category" required>
                        <option value="" disabled selected hidden>Select category</option>
                        <option value="Demographic">Demographic</option>
                    </select>


                    <input type="text" name="address" placeholder="Address" required>
                    <label for="address_category">Category:</label>
                    <select name="address_category" id="address_category" required>
                        <option value="" disabled selected hidden>Select category</option>
                        <option value="PII">PII</option>
                    </select>

                    <input type="text" name="blood_type" placeholder="Blood Type" required>
                    <label for="blood_category">Category:</label>
                    <select name="blood_category" id="blood_category" required>
                        <option value="" disabled selected hidden>Select category</option>
                        <option value="Medical">Medical</option>
                    </select>

                    <input type="text" name="organ" placeholder="Organ" required>
                    <label for="organ_category">Category:</label>
                    <select name="organ_category" id="organ_category" required>
                        <option value="" disabled selected hidden>Select category</option>
                        <option value="Medical">Medical</option>
                    </select>

                    <!-- <input type="text" name="Feedback" placeholder="Feedback">
                    <label for="Feedback">Category:</label>
                    <select name="Feedback" id="Feedback" required>
                        <option value="" disabled selected hidden>Select category</option>
                        <option value="Feedback">Feedback / non sensitive </option>
                    </select> -->


                    <br><br>
                    <input type="checkbox" name="consent" placeholder="consent" required>
                    I consent to the use of my data and that all categories chosen are correct to the best of my
                    knowledge

                    <div class="button-group">
                        <button href="{{ url_for('home_bp.homepage') }}" class="register-btn">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
