<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select form | Organ Donation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-white">

<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('home_bp.homepage') }}">Home</a>
        <div class="ms-auto">
            <a class="nav-link" href="{{ url_for('auth_bp.logout') }}">Logout</a>
        </div>
    </div>
</nav>

<div class="container text-center mt-5">
    <h2>Select an Organization</h2>
    <p class="text-muted">Choose which organization's questionnaire you want to complete.</p>

    <!--Creates the drop down menu with all the clients
    The javascript redirect gets the client id and from there the correct questionnaire is displayed-->
    <form method="GET" action="" class="mt-4">
        <div class="d-flex justify-content-center">
            <select id="clientDropdown" class="form-select w-auto" onchange="redirectToQuestionnaire(this)">
                <option value="">-- Select Organization --</option>
                {% for c in clients %}
                    <option value="{{ c[0] }}">{{ c[1] }}</option>
                {% endfor %}
            </select>
        </div>
    </form>
</div>

<script>
function redirectToQuestionnaire(select) {
    const clientId = select.value;
    if (clientId) {
        window.location.href = `/questionnaire/${clientId}`;
    }
}
</script>

</body>
</html>
