{% extends "base_auth.html" %}

{% block title %}Register | Organ Donation System{% endblock %}
{% block auth_title %}Welcome to the<br>Organ Donation System{% endblock %}
{% block card_title %}Register{% endblock %}

{% block auth_back %}
<!-- aria-label for icon-only link - screen reader -->
<a href="{{ url_for('auth_bp.login_page') }}" class="back-arrow" aria-label="Back to login">
    <i class="bi bi-arrow-left" aria-hidden="true"></i>
</a>
{% endblock %}

{% block card_content %}
<form action="/register_user" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <!-- for= labels link to inputs - screen reader form access -->
    <label for="regUsername" class="sr-only">Username</label>
    <input type="text" name="username" id="regUsername" placeholder="Name" required>
    <label for="regEmail" class="sr-only">Email address</label>
    <input type="email" name="email" id="regEmail" placeholder="Email address (used for login verification)" required>
    <label for="regPassword" class="sr-only">Password</label>
    <input type="password" name="password" id="regPassword" placeholder="Password (8 characters)" required>
    <label for="regAge" class="sr-only">Age</label>
    <input type="number" name="age" id="regAge" placeholder="Age" min="0" required>
    <label for="regAddress" class="sr-only">Address</label>
    <input type="text" name="address" id="regAddress" placeholder="Address" required>
    <div class="consent-check">
        <input class="form-check-input" type="checkbox" name="privacy_consent" id="privacyConsent" required>
        <label class="form-check-label" for="privacyConsent">
            I agree to the <a href="{{ url_for('pages_bp.privacy_policy') }}" target="_blank" rel="noopener">Privacy Policy<span class="sr-only"> (opens in new tab)</span></a>
            and consent to my data being stored securely for this service
        </label>
    </div>
    <div class="button-group">
        <button type="submit" class="register-btn">
            <i class="bi bi-person-plus"></i>Register
        </button>
    </div>
</form>
{% endblock %}
