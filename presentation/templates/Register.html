{% extends "base_auth.html" %}

{% block title %}Register | Organ Donation System{% endblock %}
{% block auth_title %}Welcome to the<br>Organ Donation System{% endblock %}
{% block card_title %}Register{% endblock %}

{% block auth_back %}
<a href="{{ url_for('auth_bp.login_page') }}" class="back-arrow">
    <i class="bi bi-arrow-left"></i>
</a>
{% endblock %}

{% block card_content %}
<form action="/register_user" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="username" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email address (used for login verification)" required>
    <input type="password" name="password" placeholder="Password" required>
    <input type="number" name="age" placeholder="Age" min="0" required>
    <input type="text" name="address" placeholder="Address" required>
    <div class="consent-check">
        <input class="form-check-input" type="checkbox" name="privacy_consent" id="privacyConsent" required>
        <label class="form-check-label" for="privacyConsent">
            I agree to the <a href="{{ url_for('pages_bp.privacy_policy') }}" target="_blank">Privacy Policy</a>
            and consent to my data being stored securely for this service
        </label>
    </div>
    <div class="button-group">
        <button type="submit" class="register-btn">
            <i class="bi bi-person-plus"></i>Register
        </button>
    </div>
</form>
{% endblock %}
