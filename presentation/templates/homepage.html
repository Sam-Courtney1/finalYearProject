{% extends "base_user.html" %}

{% block title %}Homepage | Organ Donation System{% endblock %}

{% block content %}
<div class="homepage-main">
    <h1>Hi {{username}}</h1>
    <p class="welcome-text">Welcome back</p>
    <p class="subtitle-text">Select from one of the options below</p>

    <div class="homepage-actions">
        <form action="{{ url_for('pages_bp.right_to_access') }}" method="GET">
            <button type="submit" class="action-btn action-btn-primary">
                <i class="bi bi-eye"></i>Right to Access
            </button>
        </form>

        <form action="{{ url_for('questionnaire_bp.select_submission_to_edit') }}" method="GET">
            <button type="submit" class="action-btn action-btn-primary">
                <i class="bi bi-pencil-square"></i>Edit My Answers
            </button>
        </form>

        <form action="{{ url_for('pages_bp.consent_management') }}" method="GET">
            <button type="submit" class="action-btn action-btn-primary">
                <i class="bi bi-shield-check"></i>Manage Consent
            </button>
        </form>

        <form action="{{ url_for('pages_bp.right_to_forget') }}" method="POST" class="action-full-width">
            <button type="submit" class="action-btn action-btn-danger">
                <i class="bi bi-trash3"></i>Right to Forget / Delete Account
            </button>
        </form>
    </div>
</div>
{% endblock %}
