{% extends "base_auth.html" %}

{% block title %}Set New Password | Organ Donation System{% endblock %}
{% block auth_title %}Organ Donation System{% endblock %}
{% block card_title %}Set New Password{% endblock %}

{% block card_content %}
<form action="{{ url_for('auth_bp.reset_password', token=token) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label"><i class="bi bi-lock me-1"></i>New Password</label>
    <input type="password" name="password" placeholder="At least 8 characters" minlength="8" required autofocus>
    <label class="form-label" style="margin-top:0.75rem;">
        <i class="bi bi-lock-fill me-1"></i>Confirm Password
    </label>
    <input type="password" name="confirm_password" placeholder="Repeat your new password" minlength="8" required>
    <div class="button-group" style="margin-top:1rem;">
        <button type="submit" class="login-btn">
            <i class="bi bi-check-circle"></i>Update Password
        </button>
    </div>
</form>
{% endblock %}
