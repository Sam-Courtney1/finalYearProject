{% extends "base_auth.html" %}

{% block title %}Set New Password | Organ Donation System{% endblock %}
{% block auth_title %}Organ Donation System{% endblock %}
{% block card_title %}Set New Password{% endblock %}

{% block card_content %}
<form action="{{ url_for('auth_bp.reset_password', token=token) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <!-- for= links label to input - screen reader form access -->
    <label class="form-label" for="rpPassword"><i class="bi bi-lock me-1" aria-hidden="true"></i>New Password</label>
    <input type="password" name="password" id="rpPassword" placeholder="At least 8 characters" minlength="8" required autofocus>
    <label class="form-label" for="rpConfirm" style="margin-top:0.75rem;">
        <i class="bi bi-lock-fill me-1" aria-hidden="true"></i>Confirm Password
    </label>
    <input type="password" name="confirm_password" id="rpConfirm" placeholder="Repeat your new password" minlength="8" required>
    <div class="button-group" style="margin-top:1rem;">
        <button type="submit" class="login-btn">
            <i class="bi bi-check-circle" aria-hidden="true"></i>Update Password
        </button>
    </div>
</form>
{% endblock %}
