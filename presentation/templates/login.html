{% extends "base_auth.html" %}

{% block title %}Login | Organ Donation System{% endblock %}
{% block auth_title %}Organ Donation System{% endblock %}
{% block card_title %}Login{% endblock %}

{% block card_content %}
<form action="{{ url_for('auth_bp.login') }}" method="POST">
    <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
    <input type="text" name="username" placeholder="Enter your username" required>
    <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
    <input type="password" name="password" placeholder="Enter your password" required>
    <div class="button-group">
        <button type="submit" class="login-btn">
            <i class="bi bi-box-arrow-in-right"></i>Login
        </button>
    </div>
</form>
<div class="button-group">
    <a href="{{ url_for('auth_bp.register_page') }}" class="register-btn">
        <i class="bi bi-person-plus"></i>Create an Account
    </a>
</div>
{% endblock %}
