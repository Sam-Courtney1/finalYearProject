<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('client_dashboard') }}">Dashboard</a>
      <div class="ms-auto">
        <a href="{{ url_for('client_logout') }}">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2>Questionnaire Editor</h2>
    <!--Fix the below, looping through messages prints irrelivant messages
    need to fix to only print the correct one-->
    {% for message in get_flashed_messages() %}
    <p class="flash">{{ message }}</p>
    {% endfor %}

    <form method="POST" class="row g-2 mb-4">
      <div class="col-md-4">
        <input type="text" name="label" class="form-control" placeholder="Field label" required>
      </div>
      <div class="col-md-3">
        <select name="field_type" class="form-select" required>
          <option value="text">Text</option>
          <option value="number">Number</option>
        </select>
      </div>
      <div class="col-md-3">
        <select name="category" class="form-select" required>
          <option value="PII">PII</option>
          <option value="Medical">Medical</option>
          <option value="Demographic">Demographic</option>
        </select>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Add Field</button>
      </div>
    </form>

    <table class="table table-bordered table-sm">
      <thead>
        <tr>
          <th>Label</th>
          <th>Type</th>
          <th>Category</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for f in fields %}
        <tr>
          <td>{{ f[1] }}</td>
          <td>{{ f[2] }}</td>
          <td>{{ f[3] }}</td>
          <td>
            <form method="POST" action="{{ url_for('client_delete_field', field_id=f[0]) }}">
              <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

  </div>
</body>

</html>
