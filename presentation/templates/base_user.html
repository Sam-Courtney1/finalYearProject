{% extends "base.html" %}
{% block body_class %}user-page{% endblock %}

{% block extra_scripts %}
<!-- Session inactivity timeout: warn at 9 min, redirect at 10 min -->
<div class="modal fade" id="sessionWarningModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content" style="border-radius:12px;">
            <div class="modal-body text-center p-4">
                <i class="bi bi-clock-history" style="font-size:2rem;color:var(--primary);"></i>
                <h5 class="mt-2 mb-1">Still there?</h5>
                <p class="text-muted mb-3" style="font-size:0.9rem;">
                    You'll be logged out in <strong id="warningCountdown">60</strong> seconds due to inactivity.
                </p>
                <button type="button" class="btn btn-success w-100" id="stayLoggedIn">
                    <i class="bi bi-check-circle me-1"></i>Stay Logged In
                </button>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    const WARN_AT  = 9 * 60 * 1000;  // 9 minutes
    const LOGOUT_AT = 10 * 60 * 1000; // 10 minutes
    let idleMs = 0;
    let warningShown = false;
    let warnTimer = null;

    function resetIdle() {
        idleMs = 0;
        warningShown = false;
        clearInterval(warnTimer);
        // Hide modal if visible
        const modal = bootstrap.Modal.getInstance(document.getElementById('sessionWarningModal'));
        if (modal) modal.hide();
    }

    // Reset idle timer on any user activity
    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt =>
        document.addEventListener(evt, resetIdle, { passive: true })
    );

    // "Stay logged in" button makes a lightweight request to reset server-side timer
    document.getElementById('stayLoggedIn').addEventListener('click', () => {
        fetch('/ping', { method: 'GET', credentials: 'same-origin' }).catch(() => {});
        resetIdle();
    });

    // Tick every second
    setInterval(() => {
        idleMs += 1000;
        if (idleMs >= LOGOUT_AT) {
            window.location.href = '{{ url_for("auth_bp.logout") }}';
            return;
        }
        if (idleMs >= WARN_AT && !warningShown) {
            warningShown = true;
            new bootstrap.Modal(document.getElementById('sessionWarningModal')).show();
            let secs = Math.round((LOGOUT_AT - idleMs) / 1000);
            const el = document.getElementById('warningCountdown');
            el.textContent = secs;
            warnTimer = setInterval(() => {
                secs--;
                el.textContent = secs;
                if (secs <= 0) clearInterval(warnTimer);
            }, 1000);
        }
    }, 1000);
})();
</script>
{% endblock extra_scripts %}

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-modern">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('home_bp.homepage') }}">
            <i class="bi bi-heart-pulse"></i>Home
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#userNav"
                aria-controls="userNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="userNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link {% if request.endpoint and 'questionnaire' in request.endpoint %}active{% endif %}"
                   href="{{ url_for('questionnaire_bp.select_questionnaire') }}">
                    <i class="bi bi-clipboard2-pulse"></i>Questionnaire
                </a>
                <a class="nav-link {% if request.endpoint and 'consent' in request.endpoint %}active{% endif %}"
                   href="{{ url_for('pages_bp.consent_management') }}">
                    <i class="bi bi-shield-check"></i>Consent
                </a>
                <a class="nav-link" href="{{ url_for('auth_bp.logout') }}">
                    <i class="bi bi-box-arrow-right"></i>Logout
                </a>
            </div>
        </div>
    </div>
</nav>
{% endblock %}
