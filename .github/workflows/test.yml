name: Run Tests & Linting

on:
  push:
    branches: [main, mobile-code]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 application/ data/ wsgi.py --max-line-length=120 --count --show-source --statistics

  lint-html:
    name: HTML Template Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install djlint
        run: pip install djlint

      - name: Lint Jinja2 templates
        run: djlint presentation/templates/ --profile=jinja --lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint-python, lint-html]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --tb=short --cov=application --cov=data --cov-report=term-missing -q
